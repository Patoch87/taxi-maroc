# Test réel Bab Taxi sur Render (offre gratuite) : le serveur partagé et le site web pour l'iPhone.
# Déploiement : https://render.com/deploy?repo=https://github.com/Patoch87/taxi-maroc
services:
  - type: web
    name: bab-taxi
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Clé du centre de sécurité (vidéos SOS) : tirée au hasard par Render, lisible dans le tableau de bord.
      # Page : https://bab-taxi.onrender.com/sos/centre?cle=<SOS_CENTRE_TOKEN>
      - key: SOS_CENTRE_TOKEN
        generateValue: true
      # Agent WhatsApp de commande vocale (backend/src/whatsapp).
      # Jeton à recopier dans Meta (webhook) et clé du simulateur https://bab-taxi.onrender.com/whatsapp/demo?cle=<WHATSAPP_DEMO_CLE>
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_DEMO_CLE
        generateValue: true
      # Clés secrètes à saisir dans le tableau de bord Render (Environment) : jamais dans le dépôt.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
  # Site web (iPhone, Safari), construit par GitHub Actions sur la branche « web ».
  - type: web
    name: bab-taxi-web
    runtime: static
    branch: web
    buildCommand: echo "site déjà construit"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
