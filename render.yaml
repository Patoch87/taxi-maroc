# Test réel Bab Taxi sur Render, à Francfort (le plus proche du Maroc) : serveur toujours éveillé
# (offre Starter) + base PostgreSQL qui garde comptes, courses, plaintes et compteurs de publicité.
# Déploiement : https://render.com/deploy?repo=https://github.com/Patoch87/taxi-maroc
services:
  - type: web
    name: bab-taxi-eu
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base de données (adresse interne, même région).
      - key: DATABASE_URL
        fromDatabase:
          name: bab-taxi-db
          property: connectionString
      # Clé du centre de sécurité (vidéos SOS) : tirée au hasard par Render, lisible dans le tableau de bord.
      # Page : https://bab-taxi-eu.onrender.com/sos/centre?cle=<SOS_CENTRE_TOKEN>
      - key: SOS_CENTRE_TOKEN
        generateValue: true
      # Agent WhatsApp de commande vocale (backend/src/whatsapp).
      # Jeton à recopier dans Meta (webhook) et clé du simulateur https://bab-taxi-eu.onrender.com/whatsapp/demo?cle=<WHATSAPP_DEMO_CLE>
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_DEMO_CLE
        generateValue: true
      # Clés secrètes à saisir dans le tableau de bord Render (Environment) : jamais dans le dépôt.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Numéro WhatsApp public de Bab Taxi (ex. 212522000000) : affiche « Commander sur WhatsApp » dans l'application.
      # Seuls les numéros qui ont un compte dans l'application peuvent commander (BAB_WHATSAPP_OUVERT=oui pour tout ouvrir).
      - key: WHATSAPP_NUMERO_PUBLIC
        sync: false
      # Vrais codes SMS (Twilio Verify). Sans ces trois clés, le code de test BAB_CODE_TEST (1234) est affiché à l'écran.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false
  # Site web (iPhone, Safari), construit par GitHub Actions sur la branche « web ».
  - type: web
    name: bab-taxi-web
    runtime: static
    branch: web
    buildCommand: echo "site déjà construit"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: bab-taxi-db
    databaseName: babtaxi
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
