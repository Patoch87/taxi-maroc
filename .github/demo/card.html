<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bab Taxi</title>
<style>
  /* Cartes de la vidéo de démonstration (titre, chapitres, atouts, rentabilité, fin) :
     vert du Maroc, rouge, crème. Écran 390 x 634. */
  html, body { margin: 0; height: 100%; }
  body {
    background: #FFF8E7;
    font-family: 'Noto Sans', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #14213D;
  }
  .band { position: fixed; left: 0; right: 0; height: 14px; }
  .top { top: 0; background: #C1272D; }
  .bottom { bottom: 0; background: #006233; }
  .logo {
    width: 168px; height: 168px; border-radius: 40px; background: #006233;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .logo img { width: 150px; height: 150px; border-radius: 34px; }
  h1 { margin: 28px 24px 6px; font-size: 38px; font-weight: 900; color: #006233; }
  p { margin: 6px 28px; font-size: 21px; font-weight: 700; line-height: 1.35; }
  .kicker { margin-top: 26px; font-size: 17px; font-weight: 900; letter-spacing: .12em; color: #C1272D;
            text-transform: uppercase; }
  .small .logo { width: 72px; height: 72px; border-radius: 18px; }
  .small .logo img { width: 64px; height: 64px; border-radius: 15px; }
  .small .kicker { margin-top: 14px; font-size: 14px; }
  .small h1 { margin: 4px 20px 12px; font-size: 28px; }
  .chapter .logo { width: 104px; height: 104px; border-radius: 26px; }
  .chapter .logo img { width: 92px; height: 92px; border-radius: 22px; }
  .chapter h1 { margin-top: 8px; font-size: 36px; }
  .chapter p { font-size: 22px; font-weight: 600; max-width: 320px; }
  ul { list-style: none; margin: 0; padding: 0 22px; width: 346px; text-align: left; }
  li { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 11px; font-size: 17px; font-weight: 700;
       line-height: 1.3; }
  li::before { content: '✓'; flex: none; width: 24px; height: 24px; border-radius: 12px; background: #006233;
               color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  li span { display: block; font-size: 13.5px; font-weight: 500; color: #4A5468; margin-top: 2px; }
  .chart { width: 350px; }
  .note { margin-top: 10px; font-size: 13px; color: #4A5468; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 346px; }
  .kpi { background: #fff; border-radius: 16px; padding: 12px 8px; border: 1.5px solid #E6DCC3; }
  .kpi b { display: block; font-size: 22px; font-weight: 900; color: #006233; }
  .kpi.red b { color: #C1272D; }
  .kpi small { display: block; font-size: 13px; font-weight: 600; color: #4A5468; margin-top: 2px; line-height: 1.25; }
</style>
</head>
<body>
  <div class="band top"></div>
  <div class="logo"><img src="logo.png" alt="Bab, la porte"></div>
  <div class="kicker" id="kicker" hidden></div>
  <h1 id="title">Bab Taxi</h1>
  <p id="line"></p>
  <div id="extra"></div>
  <div class="band bottom"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    $('title').textContent = q.get('title') || 'Bab Taxi';
    $('line').textContent = q.get('line') || '';
    if (q.get('kicker')) {
      $('kicker').textContent = q.get('kicker');
      $('kicker').hidden = false;
    }
    // Carte de chapitre : « chapter=1/3 ».
    if (q.get('chapter')) {
      document.body.classList.add('chapter');
      $('kicker').textContent = 'Chapitre ' + q.get('chapter');
      $('kicker').hidden = false;
    }
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    // Liste d'atouts : « items=Titre~détail|Titre~détail ».
    if (q.get('items')) {
      document.body.classList.add('small');
      $('line').remove();
      $('extra').innerHTML = '<ul>' + q.get('items').split('|').map((it) => {
        const [t, d] = it.split('~');
        return `<li><div>${esc(t)}${d ? `<span>${esc(d)}</span>` : ''}</div></li>`;
      }).join('') + '</ul>';
    }
    // Rentabilité : chiffre d'affaires et coûts (business plan, M MAD hors taxes).
    if (q.get('slide') === 'chart') {
      document.body.classList.add('small');
      const rows = [
        ['2027', 10.9, 19.1], ['2028', 47.5, 40.6], ['2029', 108.5, 60.3], ['2030', 215.5, 85], ['2031', 283.5, 90],
      ];
      const W = 350, H = 300, x0 = 8, base = 236, top = 30, mx = 300, band = (W - x0) / rows.length, bw = band * .52;
      const y = (v) => base - v / mx * (base - top);
      const cx = (i) => x0 + band * i + band / 2;
      const fmt = (v) => v.toLocaleString('fr-FR', { maximumFractionDigits: 1 });
      let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" font-family="Noto Sans, sans-serif">`;
      svg += `<line x1="${x0}" y1="${base}" x2="${W}" y2="${base}" stroke="#B9AE93"/>`;
      rows.forEach(([an, ca, c], i) => {
        const r = ca - c;
        svg += `<rect x="${cx(i) - bw / 2}" y="${y(ca)}" width="${bw}" height="${base - y(ca)}" rx="4" fill="#006233"/>`;
        svg += `<text x="${cx(i)}" y="${y(Math.max(ca, c)) - 8}" text-anchor="middle" font-size="13" font-weight="800" fill="#14213D">${fmt(ca)}</text>`;
        svg += `<text x="${cx(i)}" y="${base + 18}" text-anchor="middle" font-size="13" fill="#4A5468">${an}</text>`;
        svg += `<text x="${cx(i)}" y="${base + 38}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${r >= 0 ? '#006233' : '#C1272D'}">${r >= 0 ? '+' : ''}${fmt(r)}</text>`;
      });
      svg += `<polyline fill="none" stroke="#C1272D" stroke-width="3" points="${rows.map(([, , c], i) => `${cx(i)},${y(c)}`).join(' ')}"/>`;
      rows.forEach(([, , c], i) => (svg += `<circle cx="${cx(i)}" cy="${y(c)}" r="4.5" fill="#C1272D"/>`));
      svg += `<text x="${x0}" y="${base + 58}" font-size="12" fill="#4A5468">Résultat par an</text>`;
      svg += '</svg>';
      $('extra').innerHTML = svg +
        '<div class="note"><b style="color:#006233">■</b> Chiffre d\'affaires &nbsp; <b style="color:#C1272D">━</b> Coûts &nbsp; · M MAD hors taxes</div>';
    }
    // Chiffres clés.
    if (q.get('slide') === 'kpis') {
      document.body.classList.add('small');
      $('line').remove();
      const k = [
        ['2028', 'point mort, 6 villes du Mondial couvertes'],
        ['15 M MAD', 'levée de fonds en 2027'],
        ['283 M MAD', "chiffre d'affaires visé en 2031"],
        ['+193 M MAD', 'résultat visé en 2031'],
        ['0 MAD', 'pris sur les courses partagées', 'red'],
        ['100 %', 'du prix du compteur pour le chauffeur', 'red'],
      ];
      $('extra').innerHTML = '<div class="kpis">' +
        k.map(([v, t, c]) => `<div class="kpi ${c || ''}"><b>${v}</b><small>${t}</small></div>`).join('') + '</div>';
    }
  </script>
</body>
</html>
