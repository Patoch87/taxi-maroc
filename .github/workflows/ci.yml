name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android-apk:
    runs-on: ubuntu-latest
    # La clé Google Maps est un secret de l'environnement GitHub « MAPS_API_KEY ».
    environment: MAPS_API_KEY
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Les journaux des tâches ne sont pas lisibles partout : les échecs sont aussi publiés en annotations.
      - name: flutter test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -v "^#" test.log | grep -E -A4 "\[E\]|EXCEPTION CAUGHT|overflowed|Expected:" | grep -v "^--$" | head -40 | while IFS= read -r l; do echo "::error title=Test::$l"; done
          fi
          exit $status
      # APK installable directement sur un téléphone Android. API_URL : serveur du test réel
      # (variable de dépôt API_URL, sinon Render) ; le mode démo reste dans le menu.
      # Clé Google Maps facultative (secret MAPS_API_KEY) : sans elle, l'APK garde la carte OpenStreetMap.
      # Indique (sans la montrer) si la clé est présente : annotation lisible sur l'exécution.
      # Clé de signature Android stable (secret BAB_KEYSTORE_B64 = fichier .jks en base64, mot de passe BAB_KEYSTORE_PASS).
      - name: Clé de signature
        env:
          BAB_KEYSTORE_B64: ${{ secrets.BAB_KEYSTORE_B64 }}
          BAB_KEYSTORE_PASS: ${{ secrets.BAB_KEYSTORE_PASS }}
        run: |
          if [ -z "$BAB_KEYSTORE_B64" ]; then
            echo "::warning title=Signature::Pas de BAB_KEYSTORE_B64 : clé de debug (mise à jour impossible sans désinstaller)"; exit 0
          fi
          # Copier-coller depuis un téléphone : espaces, retours à la ligne ou guillemets autour sont retirés.
          B64=$(printf '%s' "$BAB_KEYSTORE_B64" | tr -d ' \r\n\t"' )
          echo "::notice title=Signature::Secret de ${#B64} caractères (attendu : 3512)"
          if printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/bab.jks" 2>/dev/null \
             && keytool -list -keystore "$RUNNER_TEMP/bab.jks" -storepass "$BAB_KEYSTORE_PASS" >/dev/null 2>&1; then
            echo "BAB_KEYSTORE=$RUNNER_TEMP/bab.jks" >> "$GITHUB_ENV"
            echo "::notice title=Signature::Clé Bab Taxi stable"
          else
            echo "::warning title=Signature::BAB_KEYSTORE_B64 ou BAB_KEYSTORE_PASS invalide : clé de debug pour cette version"
          fi
      - name: Clé Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
          BAB_KEYSTORE_PASS: ${{ secrets.BAB_KEYSTORE_PASS }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then echo "::notice title=Google Maps::Clé présente (${#MAPS_API_KEY} caractères)"
          else echo "::warning title=Google Maps::Aucune clé MAPS_API_KEY : carte OpenStreetMap"; fi
      - run: flutter build apk --release --dart-define=MAPS_API_KEY="$MAPS_API_KEY" --dart-define=API_URL="$API_URL"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
          BAB_KEYSTORE_PASS: ${{ secrets.BAB_KEYSTORE_PASS }}
          API_URL: ${{ vars.API_URL || 'https://bab-taxi-eu.onrender.com' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/taxi-maroc.apk
      # « Bab Taxi Chauffeur » : application des chauffeurs (inscription, dossier validé par Bab Taxi, courses).
      - run: flutter build apk --release --dart-define=MAPS_API_KEY="$MAPS_API_KEY" --dart-define=API_URL="$API_URL" --dart-define=BAB_APP=chauffeur
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
          BAB_KEYSTORE_PASS: ${{ secrets.BAB_KEYSTORE_PASS }}
          API_URL: ${{ vars.API_URL || 'https://bab-taxi-eu.onrender.com' }}
          BAB_APP: chauffeur
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/bab-taxi-chauffeur.apk
      # « Bab Taxi Démo » : application séparée (installable à côté de la vraie), sans serveur,
      # avec des taxis et des passagers simulés. Même fichier sous l'ancien nom « prototype ».
      - run: flutter build apk --release --dart-define=MAPS_API_KEY="$MAPS_API_KEY"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
          BAB_KEYSTORE_PASS: ${{ secrets.BAB_KEYSTORE_PASS }}
          BAB_DEMO: oui
      - run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/bab-taxi-demo.apk
          cp build/app/outputs/flutter-apk/bab-taxi-demo.apk build/app/outputs/flutter-apk/taxi-maroc-prototype.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-maroc-apk
          path: |
            mobile/build/app/outputs/flutter-apk/taxi-maroc.apk
            mobile/build/app/outputs/flutter-apk/bab-taxi-chauffeur.apk
            mobile/build/app/outputs/flutter-apk/bab-taxi-demo.apk
      # Lien direct, sans compte GitHub :
      # https://github.com/Patoch87/taxi-maroc/releases/latest/download/taxi-maroc.apk
      # https://github.com/Patoch87/taxi-maroc/releases/latest/download/bab-taxi-demo.apk
      - name: Publier les APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La vidéo de démo (workflow « Vidéo de démo ») est conservée d'une version à l'autre.
          mkdir -p /tmp/keep
          gh release download demo -p taxi-maroc-demo.mp4 -D /tmp/keep || true
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo build/app/outputs/flutter-apk/taxi-maroc.apk build/app/outputs/flutter-apk/bab-taxi-chauffeur.apk \
            build/app/outputs/flutter-apk/bab-taxi-demo.apk build/app/outputs/flutter-apk/taxi-maroc-prototype.apk $(ls /tmp/keep/taxi-maroc-demo.mp4 2>/dev/null) \
            --target "$GITHUB_SHA" \
            --title "Bab Taxi" \
            --notes "taxi-maroc.apk : Bab Taxi, l'application passager (serveur, sans mode démo). bab-taxi-chauffeur.apk : Bab Taxi Chauffeur, l'application des chauffeurs (inscription et dossier validé). bab-taxi-demo.apk : Bab Taxi Démo, application séparée avec taxis et passagers simulés. Commit $GITHUB_SHA."
