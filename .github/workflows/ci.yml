name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # APK en mode démo (sans API_URL) : installable directement sur un téléphone Android.
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/taxi-maroc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-maroc-apk
          path: mobile/build/app/outputs/flutter-apk/taxi-maroc.apk
      # Lien direct, sans compte GitHub :
      # https://github.com/Patoch87/taxi-maroc/releases/latest/download/taxi-maroc.apk
      - name: Publier l'APK de démo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo build/app/outputs/flutter-apk/taxi-maroc.apk \
            --target "$GITHUB_SHA" \
            --title "Taxi Maroc - version de démo" \
            --notes "APK de démo (taxis fictifs, sans serveur) fabriqué depuis le commit $GITHUB_SHA."
