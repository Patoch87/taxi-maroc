name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android-apk:
    runs-on: ubuntu-latest
    # La clé Google Maps est un secret de l'environnement GitHub « MAPS_API_KEY ».
    environment: MAPS_API_KEY
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Les journaux des tâches ne sont pas lisibles partout : les échecs sont aussi publiés en annotations.
      - name: flutter test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -v "^#" test.log | grep -E -A4 "\[E\]|EXCEPTION CAUGHT|overflowed|Expected:" | grep -v "^--$" | head -40 | while IFS= read -r l; do echo "::error title=Test::$l"; done
          fi
          exit $status
      # APK installable directement sur un téléphone Android. API_URL : serveur du test réel
      # (variable de dépôt API_URL, sinon Render) ; le mode démo reste dans le menu.
      # Clé Google Maps facultative (secret MAPS_API_KEY) : sans elle, l'APK garde la carte OpenStreetMap.
      # Indique (sans la montrer) si la clé est présente : annotation lisible sur l'exécution.
      - name: Clé Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then echo "::notice title=Google Maps::Clé présente (${#MAPS_API_KEY} caractères)"
          else echo "::warning title=Google Maps::Aucune clé MAPS_API_KEY : carte OpenStreetMap"; fi
      - run: flutter build apk --release --dart-define=MAPS_API_KEY="$MAPS_API_KEY" --dart-define=API_URL="$API_URL"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
          API_URL: ${{ vars.API_URL || 'https://bab-taxi.onrender.com' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/taxi-maroc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-maroc-apk
          path: mobile/build/app/outputs/flutter-apk/taxi-maroc.apk
      # Lien direct, sans compte GitHub :
      # https://github.com/Patoch87/taxi-maroc/releases/latest/download/taxi-maroc.apk
      - name: Publier l'APK de démo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La vidéo de démo (workflow « Vidéo de démo ») est conservée d'une version à l'autre.
          mkdir -p /tmp/keep
          gh release download demo -p taxi-maroc-demo.mp4 -D /tmp/keep || true
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo build/app/outputs/flutter-apk/taxi-maroc.apk $(ls /tmp/keep/taxi-maroc-demo.mp4 2>/dev/null) \
            --target "$GITHUB_SHA" \
            --title "Bab Taxi - version de démo" \
            --notes "APK de démo (taxis fictifs, sans serveur) fabriqué depuis le commit $GITHUB_SHA."
