name: Vidéo de démo

# Vidéo de démonstration (MP4, portrait) enregistrée sur la version web de l'application.
# Publiée sur la branche « captures » (demo/taxi-maroc-demo.mp4) et dans la version « demo » :
# https://github.com/Patoch87/taxi-maroc/releases/latest/download/taxi-maroc-demo.mp4
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-video
  cancel-in-progress: true

jobs:
  video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Version web de l'application
        working-directory: mobile
        run: |
          flutter create --platforms web .
          flutter pub get
          flutter build web
          cp ../.github/demo/card.html build/web/demo-card.html
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png build/web/logo.png
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navigateur, polices et ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core fonts-noto-extra ffmpeg
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Enregistrement
        run: |
          (cd mobile/build/web && python3 -m http.server 8765 &)
          sleep 2
          mkdir -p video
          node .github/demo/record.js http://localhost:8765/ video
      - name: Montage
        run: python3 .github/demo/compose.py video taxi-maroc-demo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-maroc-demo
          path: taxi-maroc-demo.mp4
      - name: Publier dans la version « demo »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload demo taxi-maroc-demo.mp4 --clobber -R "${{ github.repository }}" \
            || echo "Version « demo » absente : vidéo publiée seulement sur la branche captures."
      - name: Publier sur la branche captures
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4; do
            rm -rf /tmp/cap
            if git clone -q --depth 1 -b captures "$url" /tmp/cap; then :; else
              mkdir -p /tmp/cap && git -C /tmp/cap init -q -b captures
            fi
            mkdir -p /tmp/cap/demo
            cp taxi-maroc-demo.mp4 /tmp/cap/demo/
            cd /tmp/cap
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Vidéo de démo du commit ${{ github.event.workflow_run.head_sha || github.sha }}" || true
            if git push -q "$url" captures; then exit 0; fi
            cd "$GITHUB_WORKSPACE"
            sleep $((i * 5))
          done
          exit 1
