name: taxi_maroc
description: Application Taxi Maroc pour les passagers et les chauffeurs (petits et grands taxis).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
